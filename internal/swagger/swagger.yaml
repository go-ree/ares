  /api/v1/app-configs/{config_id}/releases:
    post:
      consumes:
      - application/json
      description: 原子写入发布回执、任务与步骤快照；相同主体、操作、key 和意图只重放已提交结果
      parameters:
      - description: AppConfig ID
        in: path
        name: config_id
        required: true
        type: integer
      - description: 16～128 字节的 Ares 幂等 token
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 当前会话的 CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: 发布意图
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/publish.CreateReleaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已接纳或重放
          headers:
            Idempotency-Replayed:
              description: 重放时为 true，首次创建不返回
              type: string
            Location:
              description: 单发成功时的任务详情路径
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/publish.ReleaseReceipt'
              type: object
        "400":
          description: 请求或 Idempotency-Key 无效
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "401":
          description: 未认证
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "403":
          description: 缺少发布权限或 CSRF 校验失败
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "404":
          description: AppConfig 不存在
