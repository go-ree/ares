            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "409":
          description: 版本变化、环境停用、key 冲突或请求处理中
          headers:
            Retry-After:
              description: 相同请求仍在处理时为 1 秒
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "413":
          description: 请求、inputs 或步骤快照超限
