    post:
      consumes:
      - application/json
      description: 在同一事务中按原请求顺序提交完整回执及所有可发布任务；业务失败以 receipt item 返回
      parameters:
      - description: 16～128 字节的 Ares 幂等 token
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 当前会话的 CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: 有序批量发布意图
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/publish.CreateBatchReleaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已接纳或重放
          headers:
            Idempotency-Replayed:
              description: 重放时为 true，首次创建不返回
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/publish.ReleaseReceipt'
              type: object
        "400":
          description: 请求、条目数、重复目标或 Idempotency-Key 无效
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "401":
          description: 未认证
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "403":
          description: 缺少发布权限或 CSRF 校验失败
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "409":
          description: key 冲突或相同请求仍在处理中
          headers:
            Retry-After:
              description: 相同请求仍在处理时为 1 秒
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "413":
          description: 请求、inputs 或步骤快照超限
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "415":
          description: Content-Type 不是 application/json
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "503":
          description: 提交结果暂时无法确认
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
