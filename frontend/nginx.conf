# Never log the raw request target or Referer: OIDC callback query parameters
# contain a one-time authorization code and state value.
log_format ares_redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 8080 default_server;
    server_name _;

    access_log /dev/stdout ares_redacted;
    # Nginx error records cannot use a custom redacted format and may otherwise
    # include the raw request target. Keep request-level upstream failures in
    # the backend's already-redacted structured access log.
    error_log /dev/stderr crit;

    # Any location that declares add_header stops inheriting server-level
    # headers, so the shared include is repeated in those locations below.
    include /etc/nginx/ares-security-headers.conf;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ares_upstream http://ares:8080;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/javascript text/plain;

    location = /inside/checkup {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store";
        include /etc/nginx/ares-security-headers.conf;
        return 200 '{"status":"ok","service":"chaoscanvas"}';
    }

    location = /api/v1/job/stream/log {
        proxy_pass $ares_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
        include /etc/nginx/ares-security-headers.conf;
    }

    location = /api/v1/deploy/log/stream {
        proxy_pass $ares_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
        include /etc/nginx/ares-security-headers.conf;
    }

    location ^~ /api/ {
        # Up to three 1 MiB kubeconfigs plus JSON escaping overhead.
        client_max_body_size 4m;
        proxy_pass $ares_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/v1/auth/oidc/callback {
        proxy_pass $ares_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/ares-security-headers.conf;
    }

    location ^~ /swagger/ {
        proxy_pass $ares_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /wiki {
        proxy_pass $ares_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $ares_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location ~ ^/health/(live|ready)$ {
        proxy_pass $ares_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/ares-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/ares-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
