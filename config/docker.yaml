db:
  # Required at runtime; Docker Compose provides it through ARES_DB_CONN_STR.
  conn_str: ""
  schema_migration_timeout: "2m"

web:
  address: ":8080"

log:
  level: "info"
  accessLogfile: "stdout"
  runtimeLogfile: "stderr"

job:
  taskManager:
    cron: "@every 10s"

demo_data:
  enabled: true

settings:
  admin_token: ""
  encryption_key: ""
