db:
  # Runtime and migrator credentials are deliberately separate. Compose
  # injects only the connection required by the selected command.
  conn_str: ""
  migration_conn_str: ""
  migration_admin_conn_str: ""
  schema_migration_timeout: "2m"
  migration_lock_timeout: "30s"

web:
  address: ":8080"
  public_url: ""

log:
  level: "info"
  accessLogfile: "stdout"
  runtimeLogfile: "stderr"

worker:
  enabled: true
  concurrency: 8
  claim_batch_size: 8
  scan_interval: "1s"
  lease_duration: "30s"
  renew_interval: "10s"
  normal_poll_interval: "5s"
  backoff_min: "2s"
  backoff_max: "2m"
  drain_timeout: "20s"
  integration_sync_interval: "15s"
  legacy_poll_interval: "10s"

demo_data:
  enabled: true

settings:
  admin_token: ""
  encryption_key: ""

auth:
  root_key: ""
  oidc:
    enabled: false
  local_login:
    enabled: false
  bootstrap:
    enabled: false
  legacy_admin_token:
    enabled: false
