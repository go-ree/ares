db:
  # Set runtime and migration credentials independently. migrate up never
  # falls back to conn_str when migration_conn_str is empty.
  conn_str: ""
  migration_conn_str: ""
  # Optional one-shot DBA connection. When set, migrate up authenticates a
  # single ephemeral migrator session and keeps the account locked throughout.
  migration_admin_conn_str: ""
  schema_migration_timeout: "2m"
  migration_lock_timeout: "30s"

web:
  address: ":8080"
  public_url: ""

log:
  level: "info"
  accessLogfile: "stdout"
  runtimeLogfile: "stderr"

worker:
  enabled: true
  concurrency: 8
  claim_batch_size: 8
  scan_interval: "1s"
  lease_duration: "30s"
  renew_interval: "10s"
  normal_poll_interval: "5s"
  backoff_min: "2s"
  backoff_max: "2m"
  drain_timeout: "20s"
  integration_sync_interval: "15s"
  legacy_poll_interval: "10s"

demo_data:
  enabled: false

settings:
  # Prefer the environment variables documented in .env.example.
  admin_token: ""
  encryption_key: ""

auth:
  # `serve` requires at least one real authentication method. Prefer secret
  # files or environment variables; never commit production secret values.
  root_key: ""
  oidc:
    enabled: false
  local_login:
    enabled: false
  bootstrap:
    enabled: false
  legacy_admin_token:
    enabled: false
