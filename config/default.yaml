# 仅默认环境需要指定apollo相关信息，如果未识别到则使用默认配置生效，如果识别到则使用apollo中对应应用名称的配置下的文件生效
# 注意：仅default.yaml中建议配置apollo相关内容，其他各环境禁止创建apollo配置
apollo:
  enable: true
  address: "http://apollo-meta.aaa.cn:8080"   # 你们实际的 Apollo Config Service 域名/地址
  app_id: "ares"
  cluster: "default"
  namespace: "application"
  key: "config_file_name"                        # Apollo 里这个 key 的 value 是 "test.yaml" / "moni.yaml" 等
  timeout_ms: 1200


db:
  conn_str: "sre_tool_wr_all:SqaqaYm%W@(aaa.aaa.com:3306)/ares?charset=utf8mb4&loc=Asia%2FShanghai"

web:
  address: ":8080"

log:
  level: "info"
  accessLogfile: "log/access.log"
  runtimeLogfile: "log/runtime.log"

# 精确到秒
job:
  taskManager:
    cron: "@every 10s"
#  jobname:
#    cron: "* * * * * *"

jenkins:
  address: "http://192.168.1.1:8080"
  token:  "118f677d3e8596a6bde966ca5f57c2d018"
  username: "admin"
  password: "hello@123"

k8s:
  clusters:
    dev:
      name: "k8s-k6-dev"
      config_path: "config/k6-cluster-config"
      description: "开发环境K6集群"
    test:
      name: "k8s-k2-test" 
      config_path: "config/k2-cluster-config"
      description: "测试环境K2集群"
    moni:
      name: "k8s-k2-moni"
      config_path: "config/k2-cluster-config" 
      description: "模拟环境K2集群"

