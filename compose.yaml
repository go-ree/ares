name: ares

x-ares-backend: &ares-backend
  image: ares-api:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

services:
  auth-secrets:
    image: alpine:3.23.5
    restart: "no"
    init: true
    entrypoint: ["/bin/sh", "/opt/ares/init-auth-secrets.sh"]
    environment:
      ARES_AUTH_SECRETS_PRINT_BOOTSTRAP: ${ARES_AUTH_SECRETS_PRINT_BOOTSTRAP:-false}
    volumes:
      - ./deploy/compose/init-auth-secrets.sh:/opt/ares/init-auth-secrets.sh:ro
      - auth_secrets:/run/ares-auth
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    network_mode: none

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ares}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ares-root-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=tcp --host=127.0.0.1 --user=root --connect-timeout=5 --batch --skip-column-names --execute='SELECT 1' | grep -qx '1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ares

  database-migrator-user:
    image: mysql:8.4
    restart: "no"
    init: true
    entrypoint: ["/bin/bash", "/opt/ares/ensure-users.sh"]
    environment:
      ARES_DATABASE_ACCOUNT_ROLE: migrator
      ARES_DATABASE_ACCOUNT_CONNECT_TIMEOUT_SECONDS: ${ARES_DATABASE_ACCOUNT_CONNECT_TIMEOUT_SECONDS:-5}
      ARES_DATABASE_ACCOUNT_LOCK_TIMEOUT_SECONDS: ${ARES_DATABASE_ACCOUNT_LOCK_TIMEOUT_SECONDS:-30}
      ARES_DATABASE_ACCOUNT_INIT_TIMEOUT_SECONDS: ${ARES_DATABASE_ACCOUNT_INIT_TIMEOUT_SECONDS:-60}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ares}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ares-root-password}
      MYSQL_RUNTIME_USER: ${MYSQL_RUNTIME_USER:-ares_runtime}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-ares_migrator}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-ares-migrator-demo-password}
    volumes:
      - ./deploy/compose/mysql/01-create-users.sh:/opt/ares/ensure-users.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - ares

  migrate:
    <<: *ares-backend
    command: ["migrate", "up"]
    restart: "no"
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ARES_DB_MIGRATION_CONN_STR: "${MYSQL_MIGRATION_USER:-ares_migrator}:${MYSQL_MIGRATION_PASSWORD:-ares-migrator-demo-password}@tcp(mysql:3306)/${MYSQL_DATABASE:-ares}?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&timeout=5s&readTimeout=10s&writeTimeout=10s"
      ARES_DB_MIGRATION_ADMIN_CONN_STR: "root:${MYSQL_ROOT_PASSWORD:-ares-root-password}@tcp(mysql:3306)/${MYSQL_DATABASE:-ares}?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&timeout=5s&readTimeout=10s&writeTimeout=10s"
      ARES_DB_CONN_STR: "root:${MYSQL_ROOT_PASSWORD:-ares-root-password}@tcp(mysql:3306)/${MYSQL_DATABASE:-ares}?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&timeout=5s&readTimeout=10s&writeTimeout=10s"
      ARES_DB_SCHEMA_MIGRATION_TIMEOUT: ${ARES_DB_SCHEMA_MIGRATION_TIMEOUT:-2m}
      ARES_DB_MIGRATION_LOCK_TIMEOUT: ${ARES_DB_MIGRATION_LOCK_TIMEOUT:-30s}
    depends_on:
      database-migrator-user:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - ares

  database-runtime-user:
    image: mysql:8.4
    restart: "no"
    init: true
    entrypoint: ["/bin/bash", "/opt/ares/ensure-users.sh"]
    environment:
      ARES_DATABASE_ACCOUNT_ROLE: runtime
      ARES_DATABASE_ACCOUNT_CONNECT_TIMEOUT_SECONDS: ${ARES_DATABASE_ACCOUNT_CONNECT_TIMEOUT_SECONDS:-5}
      ARES_DATABASE_ACCOUNT_LOCK_TIMEOUT_SECONDS: ${ARES_DATABASE_ACCOUNT_LOCK_TIMEOUT_SECONDS:-30}
      ARES_DATABASE_ACCOUNT_INIT_TIMEOUT_SECONDS: ${ARES_DATABASE_ACCOUNT_INIT_TIMEOUT_SECONDS:-60}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ares}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ares-root-password}
      MYSQL_RUNTIME_USER: ${MYSQL_RUNTIME_USER:-ares_runtime}
      MYSQL_RUNTIME_PASSWORD: ${MYSQL_RUNTIME_PASSWORD:-ares-runtime-demo-password}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-ares_migrator}
    volumes:
      - ./deploy/compose/mysql/01-create-users.sh:/opt/ares/ensure-users.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - ares

  ares:
    <<: *ares-backend
    command: ["serve"]
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ARES_DB_CONN_STR: "${MYSQL_RUNTIME_USER:-ares_runtime}:${MYSQL_RUNTIME_PASSWORD:-ares-runtime-demo-password}@tcp(mysql:3306)/${MYSQL_DATABASE:-ares}?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&timeout=5s&readTimeout=10s&writeTimeout=10s"
      ARES_DB_SCHEMA_MIGRATION_TIMEOUT: ${ARES_DB_SCHEMA_MIGRATION_TIMEOUT:-2m}
      ARES_DEMO_DATA_ENABLED: ${ARES_DEMO_DATA_ENABLED:-true}
      ARES_WEB_PUBLIC_URL: http://localhost:${ARES_HTTP_PORT:-8080}
      # The bundled proxy has a fixed address so client-keyed authentication
      # limits can trust exactly one hop instead of collapsing every browser
      # into the Nginx container address.
      ARES_WEB_TRUSTED_PROXY_CIDRS: ${ARES_COMPOSE_WEB_IP:-172.30.238.10}/32
      ARES_AUTH_ROOT_KEY_FILE: /run/ares-auth/root_key
      ARES_AUTH_LOCAL_LOGIN_ENABLED: "true"
      ARES_AUTH_BOOTSTRAP_ENABLED: "true"
      ARES_AUTH_BOOTSTRAP_TOKEN_FILE: /run/ares-auth/bootstrap_token
      ARES_SETTINGS_ENCRYPTION_KEY_FILE: /run/ares-auth/settings_encryption_key
      ARES_AUTH_LEGACY_ADMIN_TOKEN_ENABLED: ${ARES_AUTH_LEGACY_ADMIN_TOKEN_ENABLED:-false}
      ARES_AUTH_LEGACY_ADMIN_TOKEN_FILE: ${ARES_AUTH_LEGACY_ADMIN_TOKEN_FILE:-}
    volumes:
      - auth_secrets:/run/ares-auth:ro
    depends_on:
      auth-secrets:
        condition: service_completed_successfully
      database-runtime-user:
        condition: service_completed_successfully
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${ARES_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q '^OK$'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - ares

  web:
    image: ares-web:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      ares:
        condition: service_healthy
    ports:
      - "${ARES_BIND_ADDRESS:-127.0.0.1}:${ARES_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/inside/checkup"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      ares:
        ipv4_address: ${ARES_COMPOSE_WEB_IP:-172.30.238.10}

volumes:
  mysql_data:
  auth_secrets:

networks:
  ares:
    driver: bridge
    ipam:
      config:
        - subnet: ${ARES_COMPOSE_SUBNET:-172.30.238.0/24}
