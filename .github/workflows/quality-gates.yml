name: 质量门禁

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"
  NODE_VERSION: "24.20.0"
  NPM_VERSION: "11.19.1"
  GOVULNCHECK_VERSION: v1.7.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  workflow-lint:
    name: 工作流语法检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 检查 GitHub Actions
        run: make workflow-check

  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 执行后端质量检查
        run: make fmt-check mod-check test vet swagger-check

  mysql-migrations:
    name: MySQL 8.4 迁移与恢复检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ares-integration-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=ares-integration-root mysql --protocol=tcp --host=127.0.0.1 --user=root --connect-timeout=5 --batch --skip-column-names --execute='SELECT 1' | grep -qx '1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ARES_TEST_MYSQL_DSN: root:ares-integration-root@tcp(127.0.0.1:3306)/mysql?parseTime=true
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 验证版本化迁移、旧库升级与故障恢复
        run: make db-integration

  mysql-accounts:
    name: MySQL 8.4 最小权限账号检查
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARES_TEST_MYSQL_CONTAINER: ares-account-init-mysql
      ARES_TEST_MYSQL_ROOT_PASSWORD: ares-account-integration-root
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 启动 MySQL 8.4
        run: |
          docker run --detach \
            --name "$ARES_TEST_MYSQL_CONTAINER" \
            --env "MYSQL_ROOT_PASSWORD=$ARES_TEST_MYSQL_ROOT_PASSWORD" \
            --health-cmd='MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=tcp --host=127.0.0.1 --user=root --connect-timeout=5 --batch --skip-column-names --execute="SELECT 1" | grep -qx 1' \
            --health-interval=3s \
            --health-timeout=5s \
            --health-retries=30 \
            mysql:8.4
          for _ in {1..40}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$ARES_TEST_MYSQL_CONTAINER")"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs "$ARES_TEST_MYSQL_CONTAINER"
              exit 1
            fi
            sleep 3
          done
          docker logs "$ARES_TEST_MYSQL_CONTAINER"
          exit 1

      - name: 动态验证账号初始化安全边界
        run: make db-account-integration

      - name: 清理 MySQL 8.4
        if: always()
        run: docker rm --force "$ARES_TEST_MYSQL_CONTAINER" >/dev/null 2>&1 || true

  race:
    name: 关键包竞态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 检查关键并发路径
        run: make race

  govulncheck:
    name: Go 漏洞检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 扫描可达 Go 漏洞
        run: make vuln

  frontend:
    name: 前端质量检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 固定 npm 版本
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: 安装依赖
        run: make frontend-install

      - name: 检查与构建前端
        run: make frontend-check

      - name: 审计完整依赖树
        run: make frontend-audit
