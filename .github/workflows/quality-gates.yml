name: 质量门禁

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"
  NODE_VERSION: "24.20.0"
  NPM_VERSION: "11.19.1"
  GOVULNCHECK_VERSION: v1.7.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  workflow-lint:
    name: 工作流语法检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 检查 GitHub Actions
        run: make workflow-check

  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 执行后端质量检查
        run: make fmt-check mod-check test vet swagger-check

  race:
    name: 关键包竞态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 检查关键并发路径
        run: make race

  govulncheck:
    name: Go 漏洞检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 扫描可达 Go 漏洞
        run: make vuln

  frontend:
    name: 前端质量检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 固定 npm 版本
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: 安装依赖
        run: make frontend-install

      - name: 检查与构建前端
        run: make frontend-check

      - name: 审计完整依赖树
        run: make frontend-audit
