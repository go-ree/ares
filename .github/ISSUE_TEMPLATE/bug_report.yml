name: 缺陷报告
description: 报告可复现的异常行为或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请先查看 SECURITY.md 中私密渠道的实际状态；不要在此模板中提交漏洞细节、凭据或敏感数据。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - 后端 API
        - 前端界面
        - 工作流或执行器
        - 数据库迁移
        - Docker Compose 或镜像
        - 文档
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 请填写版本号、镜像标签或完整提交 SHA。
      placeholder: main@0123456789abcdef
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 包括操作系统、浏览器、Go/Node、Docker/Compose 和数据库版本等相关信息。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供可重复的最小步骤；请使用脱敏数据。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为与日志
      description: 可粘贴经过脱敏的日志、截图或错误响应。
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可选。包括发生频率、临时规避方式和可能关联的 PR。
