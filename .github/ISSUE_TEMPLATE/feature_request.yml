name: 功能建议
description: 提议新的能力、改进或架构调整
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和开发计划，未发现相同提议。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景、当前限制和影响，避免只描述某个预设实现。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、核心流程或接口草案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明考虑过的其他做法及其取舍。

  - type: dropdown
    id: compatibility
    attributes:
      label: 是否可能影响兼容性
      options:
        - 不影响或不确定
        - 可能影响 API 或配置
        - 可能影响数据库或升级
        - 可能影响安全边界
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 建议的验收标准
      description: 描述可以客观验证完成的条件。
