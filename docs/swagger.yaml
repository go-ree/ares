          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 单应用进行发布动作
      tags:
      - Publish
  /api/v1/deploy/publish/batch:
    get:
