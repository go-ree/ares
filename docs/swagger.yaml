info:
  contact: {}
paths:
  /api/v1/app-configs/{config_id}:
    get:
      parameters:
      - description: 配置ID
        in: path
        name: config_id
        required: true
        type: integer
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.AppConfigs'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 按 config_id 获取配置
      tags:
      - AppConfig
    patch:
      parameters:
      - description: 配置ID
        in: path
        name: config_id
        required: true
        type: integer
      - description: 更新字段（指针语义）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.UpdateAppConfigRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 按 config_id 更新配置（PATCH：只更新传入字段）
      tags:
      - AppConfig
  /api/v1/app-configs/{config_id}/domains:
    get:
      parameters:
      - description: 配置ID
        in: path
        name: config_id
        required: true
        type: integer
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  items:
                    $ref: '#/definitions/entity.AppConfigDomain'
                  type: array
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 获取指定 config_id 的多域名列表
      tags:
      - AppConfig
    post:
      parameters:
      - description: 配置ID
        in: path
        name: config_id
        required: true
        type: integer
      - description: 单条域名配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.DomainItem'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.AppConfigDomain'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 新增单条多域名配置
      tags:
      - AppConfig
    put:
      parameters:
      - description: 配置ID
        in: path
        name: config_id
        required: true
        type: integer
      - description: domains 列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.UpsertDomainsRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 覆盖写入指定 config_id 的多域名
      tags:
      - AppConfig
  /api/v1/app-configs/{config_id}/domains/{domain_id}:
    delete:
      parameters:
      - description: 配置ID
        in: path
        name: config_id
        required: true
        type: integer
      - description: 域名记录ID
        in: path
        name: domain_id
        required: true
        type: integer
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 删除单条多域名配置
      tags:
      - AppConfig
    patch:
      parameters:
      - description: 配置ID
        in: path
        name: config_id
        required: true
        type: integer
      - description: 域名记录ID
        in: path
        name: domain_id
        required: true
        type: integer
      - description: 更新字段（指针语义）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.PatchDomainRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.AppConfigDomain'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 修改单条多域名配置（PATCH：只更新传入字段）
      tags:
      - AppConfig
  /api/v1/apps:
    post:
      parameters:
      - description: 创建单应用参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.CreateAppRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/app.CreateAppResult'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 创建单应用
      tags:
      - App
  /api/v1/apps/{app_id}:
    get:
      consumes:
      - application/json
      description: 根据应用ID获取单个应用的详细信息
      parameters:
      - description: 应用ID
        in: path
        name: app_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.Apps'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "404":
          description: 应用不存在
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 根据ID获取应用详情
      tags:
