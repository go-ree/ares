definitions:
  app.AppQuery:
    properties:
      app_id:
        type: integer
      app_name:
        type: string
      dev_language:
        type: string
      owner:
        type: string
      owner_cn:
        type: string
      page_num:
        minimum: 1
        type: integer
      page_size:
        description: 前端可选 15 30 50 100 200
        maximum: 200
        minimum: 1
        type: integer
      sort:
        $ref: '#/definitions/util.SortOption'
    type: object
  app.AppQueryResult:
    properties:
      apps:
        description: 应用列表
        items:
          $ref: '#/definitions/entity.Apps'
        type: array
      page_num:
        description: 当前页码
        type: integer
      page_size:
        description: 每页大小
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  app.CreateAppRequest:
    properties:
      app_name:
        type: string
      app_name_cn:
        type: string
      description_cn:
        type: string
      dev_language:
        type: string
      git_url:
        type: string
      owner:
        type: string
      owner_cn:
        type: string
    type: object
  app.CreateAppResult:
    properties:
      app:
        $ref: '#/definitions/entity.Apps'
      error:
        type: string
      success:
        type: boolean
    type: object
  app.CreateAppsRequest:
    properties:
      apps:
        items:
          $ref: '#/definitions/app.CreateAppRequest'
        type: array
    type: object
  app.CreateAppsResponse:
    properties:
      apps:
        items:
          $ref: '#/definitions/app.CreateAppResult'
        type: array
      failure_count:
        description: 失败数量
        type: integer
      success_count:
        description: 成功数量
        type: integer
      total_count:
        type: integer
    type: object
  entity.Apps:
    properties:
      app_id:
        type: integer
      app_name:
        type: string
      app_name_cn:
        type: string
      created_at:
        format: date-time
        type: string
      deleted_at:
        format: date-time
        type: string
      description_cn:
        type: string
      dev_language:
        type: string
      git_url:
        type: string
      owner:
        type: string
      owner_cn:
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  entity.TaskRecord:
    properties:
      app_name:
        type: string
      auto_deploy:
        type: integer
      cd_build_id:
        type: integer
      cd_job_name:
        type: string
      ci_build_id:
        type: integer
      ci_job_name:
        type: string
      created_at:
        format: date-time
        type: string
      deleted_at:
        format: date-time
        type: string
      message:
        type: string
      pipeline_param:
        type: string
      products:
        type: string
      status:
        type: string
      task_id:
        type: integer
      updated_at:
        format: date-time
        type: string
    type: object
  jenkins.Node:
    properties:
      node_name:
        type: string
      node_status:
        type: string
    type: object
  publish.CreateBatchPublishRequest:
    properties:
      batch_publish:
        items:
          $ref: '#/definitions/publish.CreatePublishRequest'
        type: array
    type: object
  publish.CreateBatchPublishResponse:
    properties:
      failure_count:
        description: 失败数量
        type: integer
      success_count:
        description: 成功数量
        type: integer
      task_records:
        items:
          $ref: '#/definitions/publish.CreatePublishResult'
        type: array
      total_count:
        description: 总体数量
        type: integer
    type: object
  publish.CreatePublishRequest:
    properties:
      app_name:
        type: string
      branch:
        type: string
      env:
        type: string
    type: object
  publish.CreatePublishResult:
    properties:
      error:
        type: string
      success:
        type: boolean
      task_record:
        $ref: '#/definitions/entity.TaskRecord'
    type: object
  util.ResponseTemplate:
    properties:
      code:
        description: 此处约定：1代表成功，0代表失败
        type: integer
      error:
        description: 如果请求失败，这里一定要给出错误的信息
      help:
        description: 显示接口文档地址，便于别人排错
        type: string
      msg:
        description: 对请求结果的描述消息，可以为空
        type: string
      result:
        description: 如果请求成功，这里给出成功的结果
    type: object
  util.SortOption:
    properties:
      direction:
        description: 排序方向：asc/desc
        type: string
      field:
        description: 排序字段
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/apps:
    post:
      parameters:
      - description: 创建单应用参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.CreateAppRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/app.CreateAppResult'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 创建单应用
      tags:
      - App
  /api/v1/apps/{app_id}:
    get:
      consumes:
      - application/json
      description: 根据应用ID获取单个应用的详细信息
      parameters:
      - description: 应用ID
        in: path
        name: app_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.Apps'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "404":
          description: 应用不存在
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 根据ID获取应用详情
      tags:
      - App
  /api/v1/apps/batch:
    post:
      parameters:
      - description: 批量创建应用参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.CreateAppsRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/app.CreateAppsResponse'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 批量创建应用
      tags:
      - App
  /api/v1/apps/name/{app_name}:
    get:
      consumes:
      - application/json
      description: 根据应用名称获取单个应用的详细信息
      parameters:
      - description: 应用名称
        in: path
        name: app_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.Apps'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "404":
          description: 应用不存在
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 根据名称获取应用详情
      tags:
      - App
  /api/v1/apps/query:
    post:
      description: 支持多条件组合查询应用列表，包括应用ID、应用名称、开发语言、负责人等
      parameters:
      - description: 应用查询参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.AppQuery'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/app.AppQueryResult'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 查询应用列表
      tags:
      - App
  /api/v1/deploy/publish:
    post:
      parameters:
      - description: 发布请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/publish.CreatePublishRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.TaskRecord'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 单应用进行发布动作
      tags:
      - Publish
  /api/v1/deploy/publish/batch:
    post:
      parameters:
      - description: 发布请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/publish.CreateBatchPublishRequest'
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/publish.CreateBatchPublishResponse'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 应用进行批量发布动作
      tags:
      - Publish
  /api/v1/deploy/publish/jobs/status:
    get:
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.TaskRecord'
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 获取任务构建列表
      tags:
      - Publish
  /api/v1/deploy/query/status:
    get:
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  type: string
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "502":
          description: 调用链异常
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 获取构建任务的状态
      tags:
      - Publish
  /api/v1/job/log/:
    get:
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  type: string
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "502":
          description: 调用链异常
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 获取流式的构建日志
      tags:
      - Publish
  /api/v1/status/nodes:
    get:
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  items:
                    $ref: '#/definitions/jenkins.Node'
                  type: array
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "502":
          description: 调用链异常
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 获取jenkins节点的状态
      tags:
      - Jenkins
  /home:
    get:
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  type: string
              type: object
      summary: 健康检测
      tags:
      - Health
swagger: "2.0"
