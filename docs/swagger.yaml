        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.PatchAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
                result:
                  $ref: '#/definitions/entity.Apps'
              type: object
        "400":
          description: 请求错误
