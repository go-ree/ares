                    type: string
                  type: object
              type: object
        "400":
          description: 请求错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
        "500":
          description: 内部错误
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
                  type: integer
              type: object
      summary: 创建构建任务
      tags:
      - Publish
    post:
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseTemplate'
            - properties:
                code:
